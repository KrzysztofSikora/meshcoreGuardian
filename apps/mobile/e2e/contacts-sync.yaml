# FR-04 AC1, AC2, AC4: contacts sync after connect, roles, chat contacts only under All contacts.
appId: io.github.krzysztofsikora.guardian
---
- launchApp:
    clearState: true
- assertVisible: "Known nodes will appear here."
- openLink: guardian://debug/scenario/connect-ok
- extendedWaitUntil:
    visible: "Scan for companions"
    timeout: 10000
- tapOn: "Scan for companions"
- extendedWaitUntil:
    visible: "Connect to MeshCore-companion"
    timeout: 10000
- tapOn: "Connect to MeshCore-companion"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "Contacts synced: 31"
    timeout: 30000
- scrollUntilVisible:
    element: "PL- RDE_Room_MXC"
- scrollUntilVisible:
    element: "PL-KR-WRBL-RPT"
- scrollUntilVisible:
    element: "Sensor test"
- scrollUntilVisible:
    element: "Unknown"
- assertNotVisible: "chat-1"
- tapOn:
    id: "filter-all"
- scrollUntilVisible:
    element: "chat-2"
    direction: UP
- scrollUntilVisible:
    element: "chat-1"
    direction: UP
- tapOn: "chat-1"
- tapOn: "Add to dashboard"
- back
- tapOn:
    id: "filter-dashboard"
- scrollUntilVisible:
    element: "chat-1"
    direction: UP
- tapOn: "Sync contacts"
- assertVisible: "Syncing contacts…"
- extendedWaitUntil:
    visible: "Contacts synced: 31"
    timeout: 30000
- takeScreenshot: phase-6-contacts-sync
