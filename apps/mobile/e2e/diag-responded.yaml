# FR-05 AC1, FR-06 AC1, FR-07, FR-08 AC1-AC2, FR-09 AC2, FR-10 AC2/AC5, FR-11: airtime notice, a run that answers, details, countdown, dashboard status.
appId: io.github.krzysztofsikora.guardian
---
- runFlow:
    file: lib/connect-diag.yaml
    env:
      SCENARIO: diag-ok
- assertVisible: "Not tested"
- tapOn: "Run diagnostic"
- assertVisible: "Shared airtime"
- tapOn: "Run diagnostic"
- extendedWaitUntil:
    visible: "Responded"
    timeout: 60000
- takeScreenshot: diag-responded-card
- tapOn: "View details"
- assertVisible: "Checks performed"
- assertVisible: "Login"
- assertVisible: "Status"
- assertVisible: "Telemetry"
- assertVisible: "Battery: 3.35 V"
- assertVisible: 'Signal of last hop \(RSSI\): .*'
- takeScreenshot: diag-responded-details
- back
- assertVisible: "Available again in .* s"
- scrollUntilVisible:
    element: "Latest telemetry"
- assertVisible: "3.35 V"
- scrollUntilVisible:
    element: ".*Not end-to-end link quality.*"
- assertVisible: "RSSI, last hop into the node"
- takeScreenshot: node-details-telemetry
# FR-12 AC1/AC2: one run gives one point, no trend yet, and its value is one tap away.
- scrollUntilVisible:
    element: "Battery voltage \\(V\\)"
- assertVisible: "Not enough data to determine trend"
- assertNotVisible:
    id: "voltage-row-0"
- tapOn: "Show values"
- assertVisible:
    id: "voltage-row-0"
- assertVisible: "Status reply"
- takeScreenshot: battery-one-sample
- scrollUntilVisible:
    element: "Recent runs"
- scroll
- assertVisible: "\\d+ s|\\d+ min \\d+ s"
- back
- scrollUntilVisible:
    element: "Responded just now"
# FR-08 AC1: the node screen shows the same history after the process was killed.
- stopApp
- launchApp
- scrollUntilVisible:
    element: "Room K"
- tapOn: "Room K"
- scrollUntilVisible:
    element: "Latest telemetry"
- assertVisible: "3.35 V"
- assertVisible: "RSSI, last hop into the node"
- takeScreenshot: node-details-after-restart
- scrollUntilVisible:
    element: "Battery voltage \\(V\\)"
- assertVisible: "Not enough data to determine trend"
- scrollUntilVisible:
    element: "Recent runs"
- scroll
- assertVisible: "\\d+ s|\\d+ min \\d+ s"
