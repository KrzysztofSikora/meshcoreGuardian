# PR #22: a saved password that opens an admin session is removed, the user is told, and the run
# stays honest ("Responded"). Guardian takes only a guest password (PRD out of scope: admin login).
appId: io.github.krzysztofsikora.guardian
---
- runFlow:
    file: lib/connect-diag.yaml
    env:
      SCENARIO: diag-ok
- scrollUntilVisible:
    element: "Guest password"
- scroll
- tapOn:
    id: "password-input"
- inputText: "pw-ADMIN-CANARY"
- hideKeyboard
- scrollUntilVisible:
    element: "Save password"
- tapOn: "Save password"
- assertVisible: "Guest password saved"
# Scroll up to the status above the button, so "Responded" stays on screen (the voltage card
# made the page taller).
- scrollUntilVisible:
    element: "Not tested"
    direction: UP
- tapOn: "Run diagnostic"
- tapOn: "Run diagnostic"
- extendedWaitUntil:
    visible: "View details"
    timeout: 60000
- scrollUntilVisible:
    element: "Responded"
    direction: UP
- scrollUntilVisible:
    element: ".*administrator session.*"
- assertVisible: ".*Only read requests were sent.*"
- scrollUntilVisible:
    element: "Guest password"
- assertVisible: ".*gives administrator rights.*"
- assertVisible: "No guest password, the app tries an open guest login"
- assertNotVisible: "Remove password"
- assertNotVisible: "pw-ADMIN-CANARY"
- takeScreenshot: guest-password-admin
