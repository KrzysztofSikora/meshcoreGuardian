# FR-14 AC1, FR-05 AC2 (smoke): a guest password is saved, survives a restart, never shown again,
# a run with it saved opens a guest session and keeps it, and removing it returns to the open guest login.
appId: io.github.krzysztofsikora.guardian
---
- runFlow:
    file: lib/connect-diag.yaml
    env:
      SCENARIO: diag-guest
- scrollUntilVisible:
    element: "Guest password"
- scroll
- assertVisible: "No guest password, the app tries an open guest login"
- assertNotVisible: "Remove password"
- tapOn:
    id: "password-input"
- inputText: "pw-LEAK-CANARY"
- hideKeyboard
- scrollUntilVisible:
    element: "Save password"
- tapOn: "Save password"
- assertVisible: "Guest password saved"
- assertVisible: "Remove password"
- assertNotVisible: "pw-LEAK-CANARY"
- takeScreenshot: guest-password-saved
# Smoke check: a run still works with a password saved (the frame bytes are proved by the
# run-controller integration test; the fake transport matches on command code only).
# Scroll up to the status above the button, so "Responded" stays on screen (the voltage card
# made the page taller).
- scrollUntilVisible:
    element: "Not tested"
    direction: UP
# The Export button under the run panel moved the scroll stops: make sure the run button is on screen.
- scrollUntilVisible:
    element: "Run diagnostic"
- tapOn: "Run diagnostic"
# The airtime notice grew the card: its confirm button may sit above the fold now.
- scrollUntilVisible:
    element: "Run diagnostic"
    direction: UP
- tapOn: "Run diagnostic"
- extendedWaitUntil:
    visible: "View details"
    timeout: 60000
- scrollUntilVisible:
    element: "Responded"
    direction: UP
- scrollUntilVisible:
    element: "Guest password saved"
# The restart loses the connection and the scenario, so only persistence is checked after it.
- stopApp
- launchApp
- scrollUntilVisible:
    element: "Room K"
    timeout: 30000
- tapOn: "Room K"
- scrollUntilVisible:
    element: "Guest password"
- assertVisible: "Guest password saved"
- assertNotVisible: "pw-LEAK-CANARY"
- scrollUntilVisible:
    element: "Remove password"
- tapOn: "Remove password"
- assertVisible: "No guest password, the app tries an open guest login"
- assertNotVisible: "Remove password"
- takeScreenshot: guest-password-none
