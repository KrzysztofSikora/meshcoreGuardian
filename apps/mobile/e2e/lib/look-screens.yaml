# NFR-09 look pass: visits every screen under ${THEME} (light|dark) and takes one screenshot each.
# The fake-build deep link forces the colour scheme; the status words are asserted so a restyle
# can never leave a status as colour alone (NFR-05, TR-19).
appId: io.github.krzysztofsikora.guardian
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Known nodes will appear here."
    timeout: 30000
- openLink: guardian://debug/theme/${THEME}
- extendedWaitUntil:
    visible: "Known nodes will appear here."
    timeout: 10000
- takeScreenshot: look-dashboard-empty-${THEME}
- openLink: guardian://debug/scenario/diag-no-reply
- extendedWaitUntil:
    visible: "Scan for companions"
    timeout: 10000
- takeScreenshot: look-connect-idle-${THEME}
- tapOn: "Scan for companions"
- extendedWaitUntil:
    visible: "Connect to MeshCore-companion"
    timeout: 10000
- tapOn: "Connect to MeshCore-companion"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- takeScreenshot: look-connect-connected-${THEME}
- back
- extendedWaitUntil:
    visible: "Contacts synced: 32"
    timeout: 30000
- takeScreenshot: look-dashboard-${THEME}
- scrollUntilVisible:
    element: "Room K"
- tapOn: "Room K"
- assertVisible: "Diagnostic"
- takeScreenshot: look-node-${THEME}
- tapOn: "Run diagnostic"
- tapOn: "Run diagnostic"
- extendedWaitUntil:
    visible: "Step: Login · Attempt 1 of 2"
    timeout: 20000
- takeScreenshot: look-run-${THEME}
- extendedWaitUntil:
    visible: "No response — cause unknown"
    timeout: 90000
- takeScreenshot: look-node-result-${THEME}
- tapOn: "View details"
- extendedWaitUntil:
    visible: "Possible causes. None of them is confirmed."
    timeout: 10000
- assertNotVisible: ".*[Oo]ffline.*"
- takeScreenshot: look-result-${THEME}
- back
- back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Settings will appear here."
    timeout: 10000
- takeScreenshot: look-settings-${THEME}
