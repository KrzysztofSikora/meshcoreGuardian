# FR-03 AC2/AC3, TR-14: old firmware shows the reason per capability and an untested notice.
appId: io.github.krzysztofsikora.guardian
---
- launchApp:
    clearState: true
- assertVisible: "Known nodes will appear here."
- openLink: guardian://debug/scenario/unsupported-capability
- extendedWaitUntil:
    visible: "Scan for companions"
    timeout: 10000
- tapOn: "Scan for companions"
- extendedWaitUntil:
    visible: "Connect to MeshCore-companion"
    timeout: 10000
- tapOn: "Connect to MeshCore-companion"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- assertVisible: "Not supported by companion firmware v1.4.0"
- assertVisible: "Untested firmware"
